<div class="explorer-sidebar">
  <div class="sidebar-section">
    <p class="sidebar-label">Quick access</p>
    <a href="{{ '/' | relative_url }}" class="sidebar-item{% if page.nav == 'home' %} active{% endif %}">🖥 My Desktop</a>
    <a href="{{ '/blog' | relative_url }}" class="sidebar-item{% if page.nav == 'blog' %} active{% endif %}">📂 Blog</a>
    <a href="{{ '/about' | relative_url }}" class="sidebar-item{% if page.nav == 'about' %} active{% endif %}">📄 About</a>
  </div>
  {% assign all_tags = site.tags | sort %}
  {% assign tag_count = all_tags | size %}
  {% if tag_count > 0 %}
  <div class="sidebar-section">
    <p class="sidebar-label">Tags</p>
    {% for tag_pair in all_tags %}
    <a href="{{ '/blog' | relative_url }}?tag={{ tag_pair[0] | url_encode }}" class="sidebar-item tag-filter" data-tag="{{ tag_pair[0] }}">📁 {{ tag_pair[0] }} ({{ tag_pair[1].size }})</a>
    {% endfor %}
  </div>
  {% endif %}
</div>

---
layout: default
title: RTV
nav: home
address: "C:\\Users\\RTV\\Blog"
item_count: "{{ site.posts.size }} items"
---

{% include sidebar.html %}

<div class="explorer-main">
  <div class="explorer-heading">
    <h1>RTV</h1>
    <p>notes &amp; scrawls</p>
  </div>

  <div class="file-grid">
    {% for post in site.posts limit:12 %}
    <div class="file-item" data-slug="{{ post.slug }}" data-tag="{{ post.tags[0] | default: '' }}">
      <span class="file-icon">📄</span>
      <span class="file-name">{{ post.title }}.txt</span>
    </div>
    {% endfor %}

    {% if site.posts.size == 0 %}
    <p class="empty">( empty )</p>
    {% endif %}
  </div>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTV — Scrawl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 배경 낙서 SVG 레이어 -->
  <svg class="bg-doodle" xmlns="http://www.w3.org/2000/svg">
    <circle cx="8%" cy="12%" r="30" class="doodle float-1"/>
    <circle cx="92%" cy="8%" r="18" class="doodle float-2"/>
    <line x1="3%" y1="45%" x2="12%" y2="42%" class="doodle-line float-3"/>
    <line x1="88%" y1="55%" x2="97%" y2="52%" class="doodle-line float-1"/>
    <path d="M 60 820 Q 80 790, 100 820 T 140 820" class="doodle-line float-2"/>
    <circle cx="95%" cy="90%" r="24" class="doodle float-3"/>
    <circle cx="5%" cy="85%" r="14" class="doodle float-2"/>
    <path d="M 200 100 l 8 -15 l 8 15" class="doodle-line float-1"/>
    <path d="M 85% 35% l 20 0 l -10 -18 Z" class="doodle float-3" style="fill:none"/>
    <!-- 별 모양 -->
    <path d="M 50 700 l 6 -18 l 6 18 l -18 -12 l 18 0 Z" class="doodle-line float-2"/>
    <!-- 물결선 -->
    <path d="M 70% 95% Q 72% 93%, 74% 95% T 78% 95% T 82% 95%" class="doodle-line float-1"/>
  </svg>

  <!-- 헤더 -->
  <header class="header">
    <div class="logo" onclick="location.hash='#home'">
      <span class="logo-bracket">{</span> RTV <span class="logo-bracket">}</span>
    </div>
    <nav class="nav">
      <a href="#home" class="nav-link active" data-page="home">Home</a>
      <a href="#blog" class="nav-link" data-page="blog">Blog</a>
      <a href="#about" class="nav-link" data-page="about">About</a>
    </nav>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="main">

    <!-- Home -->
    <section id="page-home" class="page active">
      <div class="hero">
        <h1 class="hero-title">
          <span class="scrawl">끄적끄적,</span><br>
          <span class="scrawl delay-1">생각을 낙서하다</span>
        </h1>
        <p class="hero-sub">코드, 생각, 그리고 사이사이의 낙서들</p>
        <a href="#blog" class="btn-sketch" data-page="blog">글 보러 가기 →</a>
      </div>

      <!-- 최근 글 미리보기 -->
      <div class="recent">
        <h2 class="section-title">— 최근 낙서 —</h2>
        <div class="post-grid" id="recent-posts"></div>
      </div>
    </section>

    <!-- Blog -->
    <section id="page-blog" class="page">
      <h2 class="section-title">— 모든 낙서 —</h2>
      <div class="post-list" id="all-posts"></div>
    </section>

    <!-- About -->
    <section id="page-about" class="page">
      <div class="about-card">
        <div class="about-avatar">
          <svg viewBox="0 0 100 100" class="avatar-doodle">
            <circle cx="50" cy="38" r="22" fill="none" stroke="white" stroke-width="2"/>
            <path d="M 20 90 Q 20 60, 50 55 Q 80 60, 80 90" fill="none" stroke="white" stroke-width="2"/>
            <circle cx="42" cy="35" r="2" fill="white"/>
            <circle cx="58" cy="35" r="2" fill="white"/>
            <path d="M 44 44 Q 50 50, 56 44" fill="none" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
        <h2 class="about-name">RTV</h2>
        <p class="about-bio">
          여기에 자기소개를 적어주세요.<br>
          검은 밤, 흰 펜으로 끄적이는 생각들.
        </p>
        <div class="about-links">
          <a href="https://github.com/RTV-GIT" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- 글 상세 보기 -->
    <section id="page-post" class="page">
      <div id="post-content" class="post-detail"></div>
      <a href="#blog" class="btn-sketch back-btn" data-page="blog">← 목록으로</a>
    </section>

  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-line"></div>
    <p>© 2026 RTV — 끄적끄적 낙서 블로그</p>
  </footer>

  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
